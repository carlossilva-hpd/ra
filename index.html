<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>CNA Nexus — Raio-X da Decisão</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    .instruction {
      position: fixed;
      z-index: 30;
      left: 16px;
      right: 16px;
      top: 20px;

      padding: 12px 16px;

      border-radius: 14px;

      background: rgba(6, 26, 98, 0.94);

      color: #ffffff;

      text-align: center;

      font-size: 14px;

      transition: opacity 0.3s ease;
    }

    .instruction.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .controls {
      position: fixed;
      z-index: 40;

      left: 12px;
      right: 12px;
      bottom: 14px;

      padding: 16px;

      border-radius: 20px;

      background: rgba(255, 255, 255, 0.96);

      color: #061A62;

      box-shadow: 0 8px 28px rgba(0,0,0,.20);

      transform: translateY(140%);
      opacity: 0;

      transition:
        transform 0.35s ease,
        opacity 0.35s ease;
    }

    .controls.visible {
      transform: translateY(0);
      opacity: 1;
    }

    .controls h2 {
      margin: 0 0 4px 0;

      font-size: 18px;

      color: #061A62;
    }

    .controls .subtitle {
      margin: 0 0 14px 0;

      font-size: 13px;

      line-height: 1.35;

      color: #46516A;
    }

    .question {
      margin-top: 12px;
    }

    .question-label {
      display: block;

      margin-bottom: 7px;

      font-size: 14px;
      font-weight: 700;
    }

    .options {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 8px;
    }

    .option {
      min-height: 44px;

      border: 2px solid #D9DFEA;

      border-radius: 12px;

      background: #ffffff;

      color: #061A62;

      font-size: 13px;
      font-weight: 700;

      cursor: pointer;
    }

    .option.selected {
      border-color: #0A9FEC;

      background: #E8F6FD;
    }

    .inspect {
      width: 100%;

      min-height: 48px;

      margin-top: 16px;

      border: 0;

      border-radius: 14px;

      background: #061A62;

      color: white;

      font-size: 14px;
      font-weight: 800;

      cursor: pointer;

      transition:
        opacity .2s ease,
        transform .2s ease;
    }

    .inspect:disabled {
      opacity: .35;

      cursor: default;
    }

    .inspect:not(:disabled):active {
      transform: scale(.98);
    }

    .retest {
      display: none;

      width: 100%;

      min-height: 44px;

      margin-top: 8px;

      border: 2px solid #061A62;

      border-radius: 14px;

      background: white;

      color: #061A62;

      font-size: 14px;
      font-weight: 800;

      cursor: pointer;
    }

    .retest.visible {
      display: block;
    }

    .result-note {
      display: none;

      margin-top: 12px;

      padding: 10px 12px;

      border-radius: 12px;

      background: #F2F6FA;

      font-size: 13px;

      line-height: 1.4;
    }

    .result-note.visible {
      display: block;
    }
  </style>
</head>

<body>

  <div
    id="instruction"
    class="instruction"
  >
    Aponte para o Cartão de Inspeção Nexus
  </div>


  <!-- CONTROLES DO ESTUDANTE -->

  <section
    id="controls"
    class="controls"
  >

    <h2>
      O que aconteceu no teste?
    </h2>

    <p class="subtitle">
      Informe os estados observados na sua Cidade que Decide.
    </p>


    <div class="question">

      <span class="question-label">
        Serviço funcionando?
      </span>

      <div class="options">

        <button
          class="option"
          data-field="service"
          data-value="true"
        >
          VERDADEIRO
        </button>

        <button
          class="option"
          data-field="service"
          data-value="false"
        >
          FALSO
        </button>

      </div>

    </div>


    <div class="question">

      <span class="question-label">
        Rota liberada?
      </span>

      <div class="options">

        <button
          class="option"
          data-field="route"
          data-value="true"
        >
          VERDADEIRO
        </button>

        <button
          class="option"
          data-field="route"
          data-value="false"
        >
          FALSO
        </button>

      </div>

    </div>


    <button
      id="inspectButton"
      class="inspect"
      disabled
    >
      INSPECIONAR A DECISÃO
    </button>


    <div
      id="resultNote"
      class="result-note"
    >
    </div>


    <button
      id="retestButton"
      class="retest"
    >
      ALTERAR UMA CONDIÇÃO
    </button>

  </section>


  <!-- CENA RA -->

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      filterMinCF: 0.001;
      filterBeta: 0.01;
      missTolerance: 5;
      warmupTolerance: 5;
    "
    color-space="sRGB"
    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >


      <!-- SERVIÇO -->

      <a-entity
        id="step1"
        visible="false"
        position="-0.30 0.34 0.05"
      >

        <a-plane
          width="0.48"
          height="0.23"
          color="#061A62"
          opacity="0.96">
        </a-plane>

        <a-text
          value="SERVICO"
          color="#FFFFFF"
          align="center"
          width="1.35"
          position="0 0.055 0.02">
        </a-text>

        <a-text
          id="serviceText"
          value=""
          color="#FFFFFF"
          align="center"
          width="1.12"
          position="0 -0.045 0.02">
        </a-text>

      </a-entity>


      <!-- ROTA -->

      <a-entity
        id="step2"
        visible="false"
        position="0.30 0.34 0.05"
      >

        <a-plane
          width="0.48"
          height="0.23"
          color="#061A62"
          opacity="0.96">
        </a-plane>

        <a-text
          value="ROTA"
          color="#FFFFFF"
          align="center"
          width="1.35"
          position="0 0.055 0.02">
        </a-text>

        <a-text
          id="routeText"
          value=""
          color="#FFFFFF"
          align="center"
          width="1.12"
          position="0 -0.045 0.02">
        </a-text>

      </a-entity>


      <!-- OPERADOR -->

      <a-entity
        id="step3"
        visible="false"
        position="0 0.08 0.06"
      >

        <a-circle
          radius="0.12"
          color="#FF9046">
        </a-circle>

        <a-text
          value="E"
          color="#061A62"
          align="center"
          width="1.4"
          position="0 0 0.02">
        </a-text>

      </a-entity>


      <!-- RESULTADO -->

      <a-entity
        id="step4"
        visible="false"
        position="0 -0.18 0.06"
      >

        <a-plane
          width="0.74"
          height="0.24"
          color="#FFFFFF"
          opacity="0.97">
        </a-plane>

        <a-text
          id="formulaText"
          value=""
          color="#061A62"
          align="center"
          width="1.3"
          position="0 0.055 0.02">
        </a-text>

        <a-text
          id="resultText"
          value=""
          color="#061A62"
          align="center"
          width="1.10"
          position="0 -0.045 0.02">
        </a-text>

      </a-entity>


      <!-- RAMO -->

      <a-entity
        id="step5"
        visible="false"
        position="0 -0.43 0.07"
      >

        <a-plane
          width="0.58"
          height="0.18"
          color="#FF9046"
          opacity="0.98">
        </a-plane>

        <a-text
          id="branchText"
          value=""
          color="#061A62"
          align="center"
          width="1.25"
          position="0 0 0.02">
        </a-text>

      </a-entity>


      <!-- CONSEQUÊNCIA -->

      <a-entity
        id="step6"
        visible="false"
        position="0 -0.66 0.07"
      >

        <a-plane
          id="consequencePlane"
          width="0.82"
          height="0.20"
          color="#0A9FEC"
          opacity="0.97">
        </a-plane>

        <a-text
          id="consequenceText"
          value=""
          color="#061A62"
          align="center"
          width="1.12"
          position="0 0 0.02">
        </a-text>

      </a-entity>


    </a-entity>

  </a-scene>


  <script>

    /* ===============================
       REFERÊNCIAS
    =============================== */

    const target =
      document.querySelector("#target");

    const instruction =
      document.querySelector("#instruction");

    const controls =
      document.querySelector("#controls");

    const inspectButton =
      document.querySelector("#inspectButton");

    const retestButton =
      document.querySelector("#retestButton");

    const resultNote =
      document.querySelector("#resultNote");


    const serviceText =
      document.querySelector("#serviceText");

    const routeText =
      document.querySelector("#routeText");

    const formulaText =
      document.querySelector("#formulaText");

    const resultText =
      document.querySelector("#resultText");

    const branchText =
      document.querySelector("#branchText");

    const consequenceText =
      document.querySelector("#consequenceText");

    const consequencePlane =
      document.querySelector("#consequencePlane");


    const steps = [

      document.querySelector("#step1"),

      document.querySelector("#step2"),

      document.querySelector("#step3"),

      document.querySelector("#step4"),

      document.querySelector("#step5"),

      document.querySelector("#step6")

    ];


    /* ===============================
       ESTADO
    =============================== */

    let service = null;

    let route = null;

    let targetVisible = false;

    let timers = [];


    /* ===============================
       ESCOLHA V / F
    =============================== */

    document
      .querySelectorAll(".option")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const field =
              button.dataset.field;

            const value =
              button.dataset.value === "true";


            document
              .querySelectorAll(
                `.option[data-field="${field}"]`
              )
              .forEach(item => {
                item.classList.remove("selected");
              });


            button.classList.add("selected");


            if (field === "service") {
              service = value;
            }

            if (field === "route") {
              route = value;
            }


            updateInspectButton();

          }
        );

      });


    function updateInspectButton() {

      const ready =
        service !== null &&
        route !== null &&
        targetVisible;

      inspectButton.disabled =
        !ready;

    }


    /* ===============================
       LÓGICA
    =============================== */

    function evaluateDecision() {

      const result =
        service && route;

      return {

        result: result,

        branch:
          result
            ? "ENTAO"
            : "SENAO",

        consequence:
          result
            ? "PORTA ABRE"
            : "ROTA ALTERNATIVA"

      };

    }


    function booleanLabel(value) {

      return value
        ? "VERDADEIRO"
        : "FALSO";

    }


    function shortBoolean(value) {

      return value
        ? "V"
        : "F";

    }


    /* ===============================
       ANIMAÇÃO
    =============================== */

    function resetSteps() {

      timers.forEach(
        timer => clearTimeout(timer)
      );

      timers = [];


      steps.forEach(step => {

        step.setAttribute(
          "visible",
          false
        );

        step.removeAttribute(
          "animation"
        );

        step.setAttribute(
          "scale",
          "0.75 0.75 0.75"
        );

      });

    }


    function showStep(step) {

      step.setAttribute(
        "visible",
        true
      );


      step.setAttribute(
        "animation",
        `
        property: scale;
        from: 0.75 0.75 0.75;
        to: 1 1 1;
        dur: 300;
        easing: easeOutBack;
        `
      );

    }


    function runInspection() {

      if (
        service === null ||
        route === null ||
        !targetVisible
      ) {
        return;
      }


      const decision =
        evaluateDecision();


      serviceText.setAttribute(
        "value",
        booleanLabel(service)
      );


      routeText.setAttribute(
        "value",
        booleanLabel(route)
      );


      formulaText.setAttribute(
        "value",
        `${shortBoolean(service)} E ${shortBoolean(route)}`
      );


      resultText.setAttribute(
        "value",
        `RESULTADO: ${booleanLabel(decision.result)}`
      );


      branchText.setAttribute(
        "value",
        decision.branch
      );


      consequenceText.setAttribute(
        "value",
        decision.consequence
      );


      if (decision.result) {

        consequencePlane.setAttribute(
          "color",
          "#0A9FEC"
        );

      } else {

        consequencePlane.setAttribute(
          "color",
          "#FF9046"
        );

      }


      resetSteps();


      const delay = 650;


      steps.forEach(
        (step, index) => {

          const timer =
            setTimeout(
              () => showStep(step),
              index * delay
            );

          timers.push(timer);

        }
      );


      resultNote.innerHTML =
        `
        O sistema processou
        <strong>
          ${shortBoolean(service)}
          E
          ${shortBoolean(route)}
        </strong>
        e seguiu o ramo
        <strong>
          ${decision.branch}
        </strong>.
        `;


      resultNote.classList.add(
        "visible"
      );


      retestButton.classList.add(
        "visible"
      );


      inspectButton.textContent =
        "INSPECIONAR NOVAMENTE";

    }


    inspectButton.addEventListener(
      "click",
      runInspection
    );


    /* ===============================
       RETESTE
    =============================== */

    retestButton.addEventListener(
      "click",
      () => {

        resetSteps();


        resultNote.classList.remove(
          "visible"
        );


        retestButton.classList.remove(
          "visible"
        );


        inspectButton.textContent =
          "INSPECIONAR A DECISÃO";


        /*
          As escolhas permanecem marcadas.

          Isso é proposital.

          O aluno deve mudar APENAS
          uma variável.
        */

        controls.scrollIntoView({
          behavior: "smooth",
          block: "end"
        });

      }
    );


    /* ===============================
       TARGET
    =============================== */

    target.addEventListener(
      "targetFound",
      () => {

        targetVisible = true;


        instruction.classList.add(
          "hidden"
        );


        controls.classList.add(
          "visible"
        );


        updateInspectButton();

      }
    );


    target.addEventListener(
      "targetLost",
      () => {

        targetVisible = false;


        instruction.classList.remove(
          "hidden"
        );


        controls.classList.remove(
          "visible"
        );


        inspectButton.disabled = true;


        resetSteps();

      }
    );


    resetSteps();

  </script>

</body>

</html>
