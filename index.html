<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CNA Nexus — Raio-X da Decisão | AR scaffold</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}.ui{position:fixed;z-index:10;left:12px;right:12px;bottom:16px;background:rgba(255,255,255,.94);padding:14px;border-radius:16px;color:#061A62}.ui b{display:block;margin-bottom:4px}.badge{display:inline-block;background:#FF9046;padding:4px 8px;border-radius:999px;color:#111;font-weight:800;font-size:12px;margin-bottom:7px}
</style>
</head>
<body>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;" color-space="sRGB" renderer="colorManagement:true,physicallyCorrectLights" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
  <a-entity mindar-image-target="targetIndex:0">
    <a-plane position="0 0 0.05" width="1.2" height="0.18" color="#061A62"></a-plane>
    <a-text value="SERVICO: V    E    ROTA: F" color="#FFFFFF" align="center" width="2.2" position="0 0.02 0.07"></a-text>
    <a-plane position="0 -0.18 0.05" width="1.05" height="0.16" color="#FF9046"></a-plane>
    <a-text value="V E F = FALSO | SENAO" color="#061A62" align="center" width="2" position="0 -0.16 0.07"></a-text>
  </a-entity>
</a-scene>
</body>
</html>
