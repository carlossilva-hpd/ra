<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>CNA Nexus — Raio-X da Decisão</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    .instruction {
      position: fixed;
      z-index: 20;
      left: 16px;
      right: 16px;
      top: 20px;

      padding: 12px 16px;

      border-radius: 14px;

      background: rgba(6, 26, 98, 0.92);

      color: #ffffff;

      text-align: center;

      font-size: 14px;

      transition: opacity 0.3s ease;
    }

    .instruction.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div
    id="instruction"
    class="instruction"
  >
    Aponte para o Cartão de Inspeção Nexus
  </div>


  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      filterMinCF: 0.001;
      filterBeta: 0.01;
      missTolerance: 5;
      warmupTolerance: 5;
    "
    color-space="sRGB"
    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >

      <!-- ETAPA 1 -->
      <a-entity
        id="step1"
        visible="false"
        position="-0.30 0.34 0.05"
      >

        <a-plane
          width="0.48"
          height="0.23"
          color="#061A62"
          opacity="0.96">
        </a-plane>

        <a-text
          value="SERVICO"
          color="#FFFFFF"
          align="center"
          width="1.35"
          position="0 0.055 0.02">
        </a-text>

        <a-text
          value="VERDADEIRO"
          color="#FFFFFF"
          align="center"
          width="1.12"
          position="0 -0.045 0.02">
        </a-text>

      </a-entity>


      <!-- ETAPA 2 -->
      <a-entity
        id="step2"
        visible="false"
        position="0.30 0.34 0.05"
      >

        <a-plane
          width="0.48"
          height="0.23"
          color="#061A62"
          opacity="0.96">
        </a-plane>

        <a-text
          value="ROTA"
          color="#FFFFFF"
          align="center"
          width="1.35"
          position="0 0.055 0.02">
        </a-text>

        <a-text
          value="FALSO"
          color="#FFFFFF"
          align="center"
          width="1.2"
          position="0 -0.045 0.02">
        </a-text>

      </a-entity>


      <!-- OPERADOR -->
      <a-entity
        id="step3"
        visible="false"
        position="0 0.08 0.06"
      >

        <a-circle
          radius="0.12"
          color="#FF9046">
        </a-circle>

        <a-text
          value="E"
          color="#061A62"
          align="center"
          width="1.4"
          position="0 0 0.02">
        </a-text>

      </a-entity>


      <!-- RESULTADO -->
      <a-entity
        id="step4"
        visible="false"
        position="0 -0.18 0.06"
      >

        <a-plane
          width="0.72"
          height="0.22"
          color="#FFFFFF"
          opacity="0.97">
        </a-plane>

        <a-text
          value="V E F"
          color="#061A62"
          align="center"
          width="1.3"
          position="0 0.055 0.02">
        </a-text>

        <a-text
          value="RESULTADO: FALSO"
          color="#061A62"
          align="center"
          width="1.15"
          position="0 -0.045 0.02">
        </a-text>

      </a-entity>


      <!-- RAMO -->
      <a-entity
        id="step5"
        visible="false"
        position="0 -0.43 0.07"
      >

        <a-plane
          width="0.58"
          height="0.18"
          color="#FF9046"
          opacity="0.98">
        </a-plane>

        <a-text
          value="SENAO"
          color="#061A62"
          align="center"
          width="1.25"
          position="0 0 0.02">
        </a-text>

      </a-entity>


      <!-- CONSEQUÊNCIA -->
      <a-entity
        id="step6"
        visible="false"
        position="0 -0.66 0.07"
      >

        <a-plane
          width="0.82"
          height="0.20"
          color="#0A9FEC"
          opacity="0.97">
        </a-plane>

        <a-text
          value="ROTA ALTERNATIVA"
          color="#061A62"
          align="center"
          width="1.15"
          position="0 0 0.02">
        </a-text>

      </a-entity>

    </a-entity>

  </a-scene>


  <script>

    const target =
      document.querySelector("#target");

    const instruction =
      document.querySelector("#instruction");

    const steps = [
      document.querySelector("#step1"),
      document.querySelector("#step2"),
      document.querySelector("#step3"),
      document.querySelector("#step4"),
      document.querySelector("#step5"),
      document.querySelector("#step6")
    ];

    let timers = [];


    function resetSteps() {

      timers.forEach(timer => clearTimeout(timer));

      timers = [];

      steps.forEach(step => {
        step.setAttribute("visible", false);
        step.setAttribute("scale", "0.75 0.75 0.75");
      });

    }


    function showStep(step) {

      step.setAttribute("visible", true);

      step.setAttribute(
        "animation",
        `
        property: scale;
        from: 0.75 0.75 0.75;
        to: 1 1 1;
        dur: 300;
        easing: easeOutBack;
        `
      );

    }


    target.addEventListener(
      "targetFound",
      () => {

        instruction.classList.add("hidden");

        resetSteps();

        const delay = 650;

        steps.forEach((step, index) => {

          const timer = setTimeout(
            () => showStep(step),
            index * delay
          );

          timers.push(timer);

        });

      }
    );


    target.addEventListener(
      "targetLost",
      () => {

        instruction.classList.remove("hidden");

        resetSteps();

      }
    );


    resetSteps();

  </script>

</body>

</html>
